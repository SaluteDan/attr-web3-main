[profile.default]
src = "contracts"
test = "test"
out = "foundry-out"
cache_path = "foundry-cache"
libs = ["node_modules", "lib"]

# Compiler settings
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true

# Gas reporting
gas_reports = ["*"]

# Fuzzing configuration
# Local default: deep runs. CI must NOT run this profile (too slow) — CI uses
# [profile.ci] below with a fast invariant profile. Daniel 2026-10-15: run 10k
# locally, never on GitHub.
[profile.default.fuzz]
runs = 10000          # Number of fuzz runs
max_test_rejects = 65536  # Max rejected inputs
seed = "0x1"        # Random seed (omit for random)

# Invariant testing — local default matches the binding brief (>=10,000 / >=256).
[profile.default.invariant]
runs = 10000        # Number of invariant runs
depth = 256             # Call sequence depth
fail_on_revert = false  # Don't fail on revert (test recovery paths)

# CI profile — FAST ONLY. GitHub runners must never do the deep local runs.
# Kept deliberately small so CI stays quick; suite HEALTH still blocks, but the
# deep 10k runs are a local/pre-PR ritual, not a GitHub gate.
[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 256, depth = 32 }
