name: Smart Contract CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile · Unit tests · Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Build package
        run: npm run build

      - name: Verify complete tarball and clean-room import
        run: npm run check:package

      - name: Run unit tests
        run: npm run test:contracts

      - name: Lint Solidity
        run: npm run lint:sol

      # Coverage is generated for reporting, not used as a required gate:
      # solidity-coverage's EIP-7825 tx-gas cap (2**24) can be exceeded by its
      # own instrumented bytecode on a test that passes uninstrumented. Only the
      # upload is conditional on a report actually existing.
      - name: Generate coverage
        run: npm run coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: ${{ hashFiles('coverage.json') != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: coverage.json
          fail_ci_if_error: false

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Slither
        run: |
          python -m pip install --upgrade pip
          python -m pip install slither-analyzer
          solc-select install 0.8.26
          solc-select use 0.8.26

      - name: Compile contracts
        run: npm run compile

      # Slither exits non-zero when it detects ANY finding, so `--fail-none` is
      # required here: the baseline gate below is what fails on NEW findings
      # (see slither.baseline.json + scripts/util/slither-baseline.js).
      - name: Run Slither (JSON report)
        run: slither . --config-file slither.config.json --json slither-report.json --fail-none

      - name: Gate against baseline
        run: node scripts/util/slither-baseline.js

      - name: Upload Slither report
        if: ${{ always() && hashFiles('slither-report.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: slither-report.json

  # Gas snapshot — ENFORCING on PR → main (Wave C, spec `specs/ci-completion.md`
  # §2.5). Runs ONLY on pull_request into `main` (never per-push on feature
  # branches): forge snapshot + fuzzing adds ~4min and is only meaningful at
  # merge review.
  #
  # Determinism [VERIFY] 2026-10-06 (local, forge 1.7.1, this tree):
  #   `npm run gas:check` run 1 → exit 0, 0 "Diff in" blocks
  #   `npm run gas:check` run 2 → exit 0, 0 "Diff in" blocks  (SAME tree)
  #   Raw outputs byte-identical modulo timings. The check IS deterministic
  #   once (a) the known-broken invariant_SumOfBalancesEqualsSupply is excluded
  #   via `--no-match-test`, and (b) the fuzz seed is pinned (`--fuzz-seed 0x1`,
  #   see the `gas:*` scripts in package.json). Without the seed pin the μ/median
  #   statistics for the `testFuzz_*` entries drifted run-to-run — that was the
  #   original instability.
  #   Control: a run that includes the excluded invariant fails deterministically
  #   (sum mismatch), which is exactly why it stays excluded.
  # Therefore the gas-diff step below is ENFORCING (not report-only): it fails
  # the job on real drift vs the committed `.gas-snapshot`.
  gas-snapshot:
    name: Gas snapshot (enforcing)
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Foundry version
        run: forge --version

      # Foundry dependency install. `lib/` is git-ignored (see .gitignore:14) and
      # forge-std is NOT a git submodule (no .gitmodules) nor a node_modules
      # package, so a clean runner has no `forge-std/Test.sol` and `forge test`
      # fails with Error (6275). The version is pinned to the committed
      # `foundry.lock` (forge-std v1.16.1) so the dep is deterministic.
      # This is the ONLY new job that runs forge; the `test`/`slither` jobs do
      # not invoke Foundry and therefore need no equivalent step.
      - name: Install Foundry dependencies
        run: forge install foundry-rs/forge-std@v1.16.1 --no-git --shallow

      # Blocking gate: fails if the suite itself breaks. The known-broken
      # invariant_SumOfBalancesEqualsSupply is excluded via the repo's existing
      # --no-match-test convention.
      - name: Run fuzz suite (forge test)
        run: npm run test:fuzz -- --no-match-test invariant_SumOfBalancesEqualsSupply

      # ENFORCING (Wave C): determinism verified 2026-10-06 (see workflow comment).
      # The gas diff is run ONCE; its output is captured and printed to BOTH the
      # job summary and the raw log, so the two can never disagree. A non-zero
      # exit here (real gas drift vs the committed snapshot) fails the job.
      - name: Gas diff vs committed snapshot (enforcing)
        run: |
          set +e
          diff_out="$(npm run gas:diff 2>&1)"
          rc=$?
          {
            echo "## Gas snapshot — enforcing (PR → main)"
            echo ""
            echo "Baseline: committed \`.gas-snapshot\`"
            echo "Command: \`npm run gas:check\` scope (forge snapshot --diff, fuzz seed pinned, known-flaky invariant excluded)"
            echo ""
            echo "The gas diff is deterministic (two consecutive \`npm run gas:check\` runs on"
            echo "the same tree both exit 0). This step fails the job on real drift."
            echo ""
            echo '```text'
            echo "${diff_out}"
            echo '```'
            echo ""
            echo "_gas:diff exit code: ${rc}_"
          } >> "$GITHUB_STEP_SUMMARY"
          # Print the SAME captured output to the raw log for quick triage.
          echo "${diff_out}"
          exit "${rc}"

  # NOTE: Foundry fuzz tests are a BLOCKING gate inside the `gas-snapshot` job
  # above (`npm run test:fuzz -- --no-match-test invariant_SumOfBalancesEqualsSupply`),
  # which runs on PRs into `main` — so suite health IS checked in CI, not only
  # locally. The smoke test remains scoped: the pre-existing invalid invariant
  # `invariant_SumOfBalancesEqualsSupply` in test/fuzz/ATTRToken.fuzz.t.sol is
  # still EXCLUDED. It sums a fixed set of holders while the fuzzer moves ATTR
  # directly, so any transfer to an untracked address breaks it; it fails
  # deterministically and would make the gate permanently red. Fix the invariant
  # (or scope invariant fuzzing to a handler) before removing the exclusion.
  # Reproduce the full fuzz run locally with `npm run test:fuzz` (add the
  # --no-match-test exclusion for the same scope CI uses).
